<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شماره تلفن شما - مدرن و سه بعدی</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --orange-accent: #ff6b00;
      --orange-glow: rgba(255, 107, 0, 0.45);
      --white-primary: #ffffff;
      --white-glow: rgba(255, 255, 255, 0.2);
      --bg-color: #08080a;
      --text-main: #ffffff;
      --text-muted: #9a9a9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    @keyframes slideUpFade {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .mobile-screen {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      position: relative;
      background-color: var(--bg-color);
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      padding-top: 8px;
    }

    .icon-container {
      position: relative;
      margin-bottom: 20px;
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .phone-outline {
      width: 82px;
      height: 124px;
      border: 3.5px solid var(--white-primary);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      box-shadow: 
        0 8px 25px rgba(0,0,0,0.8),
        0 0 25px var(--white-glow);
    }

    .phone-top-bar {
      width: 24px;
      height: 4px;
      background-color: var(--white-primary);
      border-radius: 2px;
    }

    .phone-bottom-bar {
      width: 26px;
      height: 4px;
      background-color: var(--orange-accent);
      border-radius: 2px;
    }

    .badge-plus {
      position: absolute;
      top: 10px;
      right: -12px;
      background-color: var(--orange-accent);
      color: #ffffff;
      width: 36px;
      height: 26px;
      border-radius: 9px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 17px;
      border: 3px solid var(--bg-color);
      box-shadow: 0 4px 14px var(--orange-glow);
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      opacity: 0;
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.06s forwards;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.4;
      padding: 0 16px;
      margin-bottom: 24px;
      font-weight: 400;
      opacity: 0;
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    .inputs-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      opacity: 0;
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.14s forwards;
    }

    /* --- بخش سه‌بعدی کشور با باکس کوچک داخلی --- */
    .country-3d-card {
      width: 100%;
      height: 58px;
      background: linear-gradient(145deg, #18191d 0%, #0c0d0f 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      position: relative;
      cursor: pointer;
      box-shadow: 
        0 8px 20px rgba(0, 0, 0, 0.8),
        0 2px 4px rgba(0, 0, 0, 0.9),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.25),
        inset 0 -3px 8px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
    }

    .country-3d-card:active {
      transform: translateY(2px);
      box-shadow: 
        0 4px 10px rgba(0, 0, 0, 0.8),
        inset 0 2px 5px rgba(0, 0, 0, 0.9);
    }

    .country-label {
      position: absolute;
      top: -9px;
      right: 18px;
      background: var(--bg-color);
      padding: 0 8px;
      font-size: 10px;
      font-weight: 600;
      color: var(--orange-accent);
      border-radius: 6px;
    }

    /* باکس کوچک داخل بخش کشور (Inner 3D Pill) */
    .country-inner-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(145deg, #252730 0%, #131418 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 14px;
      box-shadow: 
        0 4px 10px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6);
    }

    .flag-badge {
      width: 24px;
      height: 16px;
      border-radius: 4px;
      object-fit: cover;
      box-shadow: 0 2px 5px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.25);
    }

    .country-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    /* دکمه دایره‌ای سه بعدی سمت چپ */
    .country-arrow-btn {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: linear-gradient(145deg, #22242c 0%, #101115 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 2px 6px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    /* --- بخش شماره تلفن --- */
    .phone-3d-card {
      width: 100%;
      height: 60px;
      background: linear-gradient(145deg, #1c1d22 0%, #0d0e11 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      position: relative;
      direction: ltr;
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.8),
        0 2px 6px rgba(0, 0, 0, 0.9),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.35),
        inset 0 -4px 10px rgba(0, 0, 0, 0.9);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .phone-3d-card.focused {
      border-color: var(--orange-accent);
      box-shadow: 
        0 12px 28px rgba(0, 0, 0, 0.8),
        0 0 20px var(--orange-glow),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.5),
        inset 0 -3px 8px rgba(255, 107, 0, 0.2);
    }

    .phone-label {
      position: absolute;
      top: -9px;
      right: 18px;
      background: var(--bg-color);
      padding: 0 8px;
      font-size: 10px;
      font-weight: 600;
      color: var(--orange-accent);
      border-radius: 6px;
      direction: rtl;
    }

    .code-pill-3d {
      background: linear-gradient(145deg, #282932 0%, #131418 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 
        0 3px 8px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
      margin-right: 8px;
    }

    .code-text {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .slots-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
    }

    .digit-group {
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .group-divider {
      width: 4px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      margin: 0 1px;
    }

    .digit-slot {
      position: relative;
      width: 16px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .digit-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      opacity: 0;
      transform: scale(0.4) translateY(6px);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .digit-slot.filled .digit-text {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .slot-base {
      position: absolute;
      bottom: 6px;
      width: 10px;
      height: 3px;
      background: #000000;
      border-radius: 10px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.1);
      transition: all 0.25s ease;
    }

    .digit-slot.filled .slot-base {
      background: var(--orange-accent);
      box-shadow: 0 0 8px var(--orange-glow);
    }

    .digit-slot.current .slot-base {
      width: 12px;
      height: 3px;
      background: var(--white-primary);
      box-shadow: 0 0 8px var(--white-glow);
      animation: slotBlink 1s infinite alternate ease-in-out;
    }

    @keyframes slotBlink {
      0% { opacity: 0.3; transform: scaleX(0.8); }
      100% { opacity: 1; transform: scaleX(1.2); }
    }

    /* کیپد ۳بعدی */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-top: auto;
      margin-bottom: 20px;
      opacity: 0;
      animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.18s forwards;
    }

    .key-button {
      background: linear-gradient(145deg, #18191e 0%, #08080a 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      height: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      box-shadow: 
        0 6px 14px rgba(0, 0, 0, 0.8),
        0 2px 4px rgba(0, 0, 0, 0.9),
        inset 0 1px 1px rgba(255, 255, 255, 0.35),
        inset 0 -3px 6px rgba(0, 0, 0, 0.7);
      transition: all 0.12s ease;
    }

    .key-1 { border-top-left-radius: 26px; }
    .key-3 { border-top-right-radius: 26px; }
    .key-7 { border-bottom-left-radius: 26px; }
    .key-9 { border-bottom-right-radius: 26px; }

    .key-button:active {
      background: #050507;
      border-color: var(--orange-accent);
      transform: translateY(3px) scale(0.97);
      box-shadow: 
        0 2px 5px rgba(0, 0, 0, 0.8),
        inset 0 2px 6px rgba(0, 0, 0, 0.95),
        inset 0 0 4px rgba(255, 107, 0, 0.3);
    }

    .key-number {
      font-size: 19px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1;
    }

    .key-letters {
      font-size: 7.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .key-button-next {
      background: #08080a;
      border-color: rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
      cursor: not-allowed;
    }

    .action-text {
      font-size: 13px;
      font-weight: 600;
      color: #333333;
      transition: all 0.2s ease;
    }

    .key-button-next.active {
      background: linear-gradient(145deg, #ff7b1a 0%, #c45200 100%);
      border-color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      box-shadow: 
        0 6px 16px var(--orange-glow),
        0 2px 4px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        inset 0 -3px 6px rgba(0, 0, 0, 0.4);
    }

    .key-button-next.active .action-text {
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .key-button-next.active:active {
      transform: translateY(3px) scale(0.97);
      box-shadow: 
        0 2px 6px var(--orange-glow),
        inset 0 3px 6px rgba(0, 0, 0, 0.6);
    }

    .backspace-svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: var(--text-main);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .key-button:active .backspace-svg {
      stroke: var(--orange-accent);
    }
  </style>
</head>
<body>

  <div class="mobile-screen">
    <div class="top-section">
      <div class="icon-container">
        <div class="phone-outline">
          <div class="phone-top-bar"></div>
          <div class="phone-bottom-bar"></div>
        </div>
        <div class="badge-plus">+</div>
      </div>

      <h1 class="title">شماره تلفن شما</h1>
      <p class="subtitle">لطفاً شماره تلفن خود را جهت ورود وارد کنید.</p>

      <div class="inputs-wrapper">
        <div class="country-3d-card">
          <span class="country-label">کشور</span>
          
          <div class="country-inner-box">
            <img class="flag-badge" src="https://flagcdn.com/w40/ir.png" alt="IR Flag">
            <span class="country-title">ایران</span>
          </div>

          <div class="country-arrow-btn">▼</div>
        </div>

        <div class="phone-3d-card focused" id="phone-card">
          <span class="phone-label">شماره تلفن</span>

          <div class="code-pill-3d">
            <img class="flag-badge" src="https://flagcdn.com/w40/ir.png" alt="IR Flag" style="width: 20px; height: 14px;">
            <span class="code-text">+98</span>
          </div>

          <div class="slots-container">
            <div class="digit-group">
              <div class="digit-slot current"><span class="digit-text"></span><div class="slot-base"></div></div>
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
            </div>

            <div class="group-divider"></div>

            <div class="digit-group">
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
            </div>

            <div class="group-divider"></div>

            <div class="digit-group">
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
              <div class="digit-slot"><span class="digit-text"></span><div class="slot-base"></div></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="keypad">
      <button class="key-button key-1" onclick="addDigit('1')"><span class="key-number">1</span></button>
      <button class="key-button" onclick="addDigit('2')"><span class="key-number">2</span><span class="key-letters">ABC</span></button>
      <button class="key-button key-3" onclick="addDigit('3')"><span class="key-number">3</span><span class="key-letters">DEF</span></button>

      <button class="key-button" onclick="addDigit('4')"><span class="key-number">4</span><span class="key-letters">GHI</span></button>
      <button class="key-button" onclick="addDigit('5')"><span class="key-number">5</span><span class="key-letters">JKL</span></button>
      <button class="key-button" onclick="addDigit('6')"><span class="key-number">6</span><span class="key-letters">MNO</span></button>

      <button class="key-button key-7" onclick="addDigit('7')"><span class="key-number">7</span><span class="key-letters">PQRS</span></button>
      <button class="key-button" onclick="addDigit('8')"><span class="key-number">8</span><span class="key-letters">TUV</span></button>
      <button class="key-button key-9" onclick="addDigit('9')"><span class="key-number">9</span><span class="key-letters">WXYZ</span></button>

      <button class="key-button key-button-next" id="btn-next-wrapper" onclick="submitNumber()">
        <span class="action-text">بعدی</span>
      </button>
      <button class="key-button" onclick="addDigit('0')"><span class="key-number">0</span><span class="key-letters">+</span></button>
      <button class="key-button" onclick="removeDigit()">
        <svg class="backspace-svg" viewBox="0 0 24 24">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
        </svg>
      </button>
    </div>
  </div>

  <script>
    let currentNumber = "";
    const slots = document.querySelectorAll(".digit-slot");
    const nextBtnWrapper = document.getElementById("btn-next-wrapper");

    function renderDisplay() {
      slots.forEach((slot, index) => {
        const textSpan = slot.querySelector(".digit-text");
        
        if (index < currentNumber.length) {
          textSpan.innerText = currentNumber[index];
          slot.classList.add("filled");
          slot.classList.remove("current");
        } else {
          slot.classList.remove("filled");
          
          if (index === currentNumber.length) {
            slot.classList.add("current");
          } else {
            slot.classList.remove("current");
          }
          
          if (index >= currentNumber.length) {
            textSpan.innerText = "";
          }
        }
      });

      if (currentNumber.length === 10) {
        nextBtnWrapper.classList.add("active");
      } else {
        nextBtnWrapper.classList.remove("active");
      }
    }

    function addDigit(digit) {
      if (currentNumber.length < 10) {
        currentNumber += digit;
        renderDisplay();
      }
    }

    function removeDigit() {
      if (currentNumber.length > 0) {
        currentNumber = currentNumber.slice(0, -1);
        renderDisplay();
      }
    }

    function submitNumber() {
      if (currentNumber.length === 10) {
        alert("شماره ارسال شد: +98" + currentNumber);
      }
    }
  </script>
</body>
</html>
